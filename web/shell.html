<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>에르핀의 억지 레이스 - 보드게임 대격돌</title>
	<style>
		html, body, #canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}
		body {
			color: #e9ecef;
			background-color: #141824;
			overflow: hidden;
			touch-action: none;
			font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
		}
		#canvas {
			display: block;
		}
		#canvas:focus {
			outline: none;
		}
		/* 부팅 스플래시: 보드게임 테이블 색 바탕 + 타이틀 + 황금 로딩 게이지 + 랜덤 팁 */
		#splash {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 18px;
			padding: 24px;
			box-sizing: border-box;
			background: radial-gradient(ellipse at center, #1d2336 0%, #141824 70%);
			transition: opacity 0.45s ease;
		}
		#splash.hidden {
			opacity: 0;
			pointer-events: none;
		}
		#splash .dice {
			font-size: 56px;
			animation: roll 1.6s ease-in-out infinite;
		}
		@keyframes roll {
			0%, 100% { transform: rotate(-12deg) translateY(0); }
			50% { transform: rotate(14deg) translateY(-10px); }
		}
		#splash h1 {
			margin: 0;
			font-size: clamp(22px, 4.2vw, 40px);
			font-weight: 800;
			color: #ffe066;
			text-align: center;
			text-shadow: 0 2px 0 #8a6d00, 0 0 22px rgba(255, 200, 40, 0.35);
			letter-spacing: 0.02em;
		}
		#splash .sub {
			margin: -8px 0 0;
			font-size: clamp(13px, 2vw, 18px);
			color: #adb5bd;
		}
		#bar {
			width: min(440px, 78vw);
			height: 16px;
			border-radius: 10px;
			background: #0b0e17;
			border: 2px solid #3b4660;
			overflow: hidden;
			box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
		}
		#bar-fill {
			width: 4%;
			height: 100%;
			border-radius: 8px;
			background: linear-gradient(180deg, #ffe680 0%, #fcc419 55%, #e8a500 100%);
			box-shadow: 0 0 12px rgba(252, 196, 25, 0.7);
			transition: width 0.25s ease-out;
		}
		#bar-fill.indeterminate {
			width: 35%;
			animation: slide 1.1s ease-in-out infinite;
		}
		@keyframes slide {
			0% { margin-left: -35%; }
			100% { margin-left: 100%; }
		}
		#percent {
			font-size: 13px;
			color: #ffd43b;
			min-height: 16px;
		}
		#tip {
			max-width: min(560px, 88vw);
			text-align: center;
			font-size: clamp(13px, 2vw, 16px);
			color: #ced4da;
			line-height: 1.5;
		}
		#tip b {
			color: #74c0fc;
		}
		/* 세로 화면 안내: 세로일 때만 보이는 전체 덮개 + 전체화면/가로 고정 버튼 */
		#rotate {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 99999;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 18px;
			padding: 24px;
			box-sizing: border-box;
			background: #0d1018;
			color: #e8fff7;
			text-align: center;
		}
		@media (orientation: portrait) {
			#rotate { display: flex; }
		}
		#rotate .big { font-size: 24px; font-weight: 800; }
		#rotate .small { font-size: 14px; color: #adb5bd; line-height: 1.6; max-width: 320px; }
		#rotate button {
			font: inherit;
			font-weight: 800;
			font-size: 18px;
			padding: 14px 26px;
			border-radius: 14px;
			border: 3px solid #ffe066;
			background: #fcc419;
			color: #3b2a00;
		}
		#notice {
			display: none;
			max-width: min(560px, 88vw);
			padding: 12px 16px;
			border-radius: 10px;
			background: #3a1e24;
			border: 2px solid #ff6b6b;
			color: #ffc9c9;
			text-align: center;
			font-size: 15px;
			line-height: 1.5;
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas">
		HTML5 canvas appears to be unsupported in the current browser.<br>
		Please try updating or use a different browser.
	</canvas>
	<div id="splash">
		<div class="dice">&#127922;</div>
		<h1>에르핀의 억지 레이스 : 보드게임 대격돌</h1>
		<p class="sub">보드게임 상자를 엎는 중...</p>
		<div id="bar"><div id="bar-fill" class="indeterminate"></div></div>
		<div id="percent"></div>
		<div id="tip"></div>
		<div id="notice"></div>
	</div>
	<div id="rotate">
		<div class="big">화면을 가로로 돌려 주세요</div>
		<button id="rotate-button" type="button">전체화면으로 가로 전환</button>
		<div class="small">폰의 [자동 회전]이 꺼져 있으면 알림창에서 켜거나 위 버튼을 눌러 주세요. 가로로 바뀌면 자동으로 게임이 보입니다.</div>
	</div>
	<noscript>
		<div style="position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#141824;color:#ffc9c9;">
			이 게임은 JavaScript가 필요합니다.
		</div>
	</noscript>
	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const TIPS = [
				"<b>팁</b> 윷말끼리 만나면 자동으로 업혀 한 번에 이동해요.",
				"<b>팁</b> 카드는 내 턴 굴리기 전에 턴당 1장만 낼 수 있어요.",
				"<b>팁</b> 카드를 보드판 위로 드래그해서 놓으면 발동해요.",
				"<b>팁</b> 필살기는 기물마다 게임당 1회, 내 프로필 카드에서 눌러요.",
				"<b>팁</b> 코너(5·10번)에 정확히 멈추면 대각선 지름길로 들어가요.",
				"<b>팁</b> 3라운드마다 증강을 골라 기물·판정 도구·교칙을 바꿔요.",
				"<b>팁</b> 중앙 법전은 4칸! 새 교칙이 들어오면 가장 오래된 교칙이 밀려나요.",
				"<b>팁</b> 폰을 가로로 돌려서 플레이하세요.",
				"<b>팁</b> 방 코드 5자리로 친구와 바로 비밀 결투를 할 수 있어요.",
				"<b>팁</b> 뱅! 카드는 상대 프로필을 눌러 선두 말을 2칸 뒤로 보내요.",
			];
			// 자동 회전이 꺼진 폰: 전체화면으로 만든 뒤 가로 고정을 요청한다 (사용자 터치가 필요하다).
			document.getElementById('rotate-button').addEventListener('click', async function () {
				try { await document.documentElement.requestFullscreen(); } catch (e) { /* 지원하지 않는 브라우저 */ }
				try { await screen.orientation.lock('landscape'); } catch (e) { /* iOS 등은 지원하지 않음 */ }
			});
			const splash = document.getElementById('splash');
			const fill = document.getElementById('bar-fill');
			const percent = document.getElementById('percent');
			const tip = document.getElementById('tip');
			const notice = document.getElementById('notice');
			tip.innerHTML = TIPS[Math.floor(Math.random() * TIPS.length)];

			function setProgress(current, total) {
				if (total > 0) {
					const ratio = Math.min(current / total, 1);
					fill.classList.remove('indeterminate');
					fill.style.width = Math.max(4, Math.round(ratio * 100)) + '%';
					percent.textContent = Math.round(ratio * 100) + '%';
				} else {
					fill.classList.add('indeterminate');
					percent.textContent = '';
				}
			}

			function hideSplash() {
				splash.classList.add('hidden');
				setTimeout(function () { splash.style.display = 'none'; }, 600);
			}

			function showNotice(text) {
				notice.style.display = 'block';
				notice.textContent = text;
				fill.classList.remove('indeterminate');
			}

			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length !== 0) {
				showNotice('이 브라우저에서는 게임을 실행할 수 없습니다. 최신 브라우저를 사용해 주세요.\n(부족한 기능: ' + missing.join(', ') + ')');
			} else {
				engine.startGame({
					onProgress: setProgress,
				}).then(function () {
					setProgress(1, 1);
					hideSplash();
				}, function (err) {
					console.error(err);
					showNotice('게임을 불러오지 못했습니다: ' + err);
				});
			}
		})();
	</script>
</body>
</html>
