	<!--
		방문자·플레이 카운터 (Google Analytics 4, 비동기). 게임 로딩과 성능에 영향이 없다.
		켜는 법: https://analytics.google.com 에서 웹 데이터 스트림을 만들고, 아래 TRG_GA_ID에 측정 ID(G-로 시작)를 넣으면 끝.
		값이 비어 있거나 G-XXXXXXXXXX 그대로면 아무것도 불러오지 않는다 (외부 요청 0건).
		게임은 판이 끝날 때 window.trgTrack('match_complete', {...})를 불러 [몇 판이 플레이됐는지]도 기록한다.
	-->
	<script>
		window.TRG_GA_ID = "G-XXXXXXXXXX";
		window.dataLayer = window.dataLayer || [];
		window.trgTrack = function () {};
		(function () {
			var id = window.TRG_GA_ID;
			if (!/^G-[A-Z0-9]{6,}$/.test(id) || id === "G-XXXXXXXXXX") { return; }
			window.gtag = function () { window.dataLayer.push(arguments); };
			window.gtag("js", new Date());
			window.gtag("config", id, { anonymize_ip: true });
			window.trgTrack = function (name, params) {
				try { window.gtag("event", name, params || {}); } catch (e) {}
			};
			var tag = document.createElement("script");
			tag.async = true;
			tag.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
			document.head.appendChild(tag);
		})();
	</script>

	<style>
		html, body, #canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}
		body {
			color: #e9ecef;
			background-color: #141824;
			overflow: hidden;
			touch-action: none;
			font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;

			display: block;
		}
		#canvas:focus {
			outline: none;
		}
		/* 부팅 스플래시: 타이틀 + 크림/초록 보드게임 로딩 게이지 + 랜덤 팁 */
		#splash {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 18px;
			padding: 24px;
			box-sizing: border-box;
			background: radial-gradient(ellipse at center, #1d2336 0%, #141824 70%);
			transition: opacity 0.45s ease;
		}
		#splash.hidden {
			opacity: 0;
			pointer-events: none;
		}
		#splash h1 {
			margin: 0;
			line-height: 0;
		}
		#splash .title-logo {
			display: block;
			width: min(560px, 82vw, 56vh);
			height: auto;
			object-fit: contain;
		}
		#splash .fan {
			margin: 4px 0 0;
			font-size: clamp(11px, 1.6vw, 14px);
			color: #868e96;
		}
		#loading {
			width: min(440px, 78vw);
			padding-top: 64px;
		}
		#bar {
			--progress: 0%;
			position: relative;
			box-sizing: border-box;
			height: 30px;
			padding: 4px;
			border: 2px solid #769d48;
			border-radius: 999px;
			background: #fff4d6;
			box-shadow: 0 4px 0 #405c32, 0 6px 14px #0004, inset 0 1px 0 #fff;
		}
		#bar-track {
			height: 100%;
			overflow: hidden;
			border-radius: 999px;
			background: #dbe6ba;
			box-shadow: inset 0 2px 3px #59733b55;
		}
		#bar-fill {
			position: relative;
			width: var(--progress);
			height: 100%;
			border-radius: 999px;
			background: linear-gradient(180deg, #cbf493 0%, #8bdb50 40%, #61b83b 100%);
			box-shadow: inset 0 2px 0 #edffc5cc, inset 0 -2px 0 #3b8b3480;
			transition: width 0.25s ease-out;
			overflow: hidden;
		}
		#bar-fill::after {
			content: "";
			position: absolute;
			inset: 0;
			background: linear-gradient(110deg, transparent 25%, #ffffff50 48%, transparent 70%);
			animation: loading-gloss 2.8s ease-in-out infinite;
		}
		#bar-marker {
			position: absolute;
			left: clamp(32px, var(--progress), calc(100% - 32px));
			top: -59px;
			width: 64px;
			height: 64px;
			overflow: hidden;
			transform: translateX(-50%) scaleX(-1);
			transition: left 0.25s ease-out, opacity 0.15s;
			pointer-events: none;
			filter: drop-shadow(0 1px 1px #24331f80);
		}
		#bar-marker img {
			display: block;
			width: 768px;
			height: 64px;
			max-width: none;
			animation: loading-pet-move 0.4s steps(12) infinite;
		}
		#bar.is-indeterminate #bar-marker, #bar.has-error #bar-marker { opacity: 0; }
		#bar.is-indeterminate #bar-marker img, #bar.has-error #bar-marker img { animation-play-state: paused; }
		#bar-fill.indeterminate {
			width: 32%;
			animation: slide 1.1s ease-in-out infinite;
		}
		.loading-caption {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-top: 12px;
			font-size: 13px;
			font-weight: 700;
			color: #e7efce;
		}
		#percent {
			min-width: 58px;
			box-sizing: border-box;
			padding: 4px 9px;
			border: 1px solid #a2c76b;
			border-radius: 999px;
			background: #fff4d6;
			color: #365d2f;
			font-variant-numeric: tabular-nums;
			text-align: center;
		}
		#bar.has-error #bar-fill { animation: none; background: #bc8b61; }
		#bar.has-error #bar-fill::after { animation: none; opacity: 0; }
		@keyframes slide {
			0% { margin-left: -32%; }
			100% { margin-left: 100%; }
		}
		@keyframes loading-gloss {
			0%, 20% { transform: translateX(-100%); }
			80%, 100% { transform: translateX(100%); }
		}
		@keyframes loading-pet-move {
			to { transform: translateX(-100%); }
		}
		@media (max-height: 540px) {
			#splash { gap: 8px; padding: 12px; }
			#splash .title-logo { width: min(440px, 78vw, 52vh); }
			#loading { padding-top: 62px; }
			#bar { height: 26px; padding: 3px; }
			.loading-caption { margin-top: 9px; }
		}
		@media (prefers-reduced-motion: reduce) {
			#bar-fill, #bar-fill::after, #bar-marker, #bar-marker img, #splash { animation: none; transition: none; }
			#bar-fill.indeterminate { animation: none; margin-left: 34%; }
		}
		#tip {
			max-width: min(560px, 88vw);
			text-align: center;
			font-size: clamp(13px, 2vw, 16px);
			color: #ced4da;
			line-height: 1.5;
		}
		#tip b {
			color: #74c0fc;
		}
		/* 세로 화면 안내: 세로일 때만 보이는 전체 덮개 + 전체화면/가로 고정 버튼 */
		#rotate {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 99999;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 18px;
			padding: 24px;
			box-sizing: border-box;
			background: #0d1018;
			color: #e8fff7;
			text-align: center;
		}
		@media (orientation: portrait) {
			#rotate { display: flex; }
		}
		#rotate .big { font-size: 24px; font-weight: 800; }
		#rotate .small { font-size: 14px; color: #adb5bd; line-height: 1.6; max-width: 320px; }
		#rotate button {
			font: inherit;
			font-weight: 800;
			font-size: 18px;
			padding: 14px 26px;
			border-radius: 14px;
			border: 3px solid #ffe066;
			background: #fcc419;
			color: #3b2a00;
		}
		#notice {
			display: none;
			max-width: min(560px, 88vw);
			padding: 12px 16px;
			border-radius: 10px;
			background: #3a1e24;
			border: 2px solid #ff6b6b;
			color: #ffc9c9;
			text-align: center;
			font-size: 15px;
			line-height: 1.5;
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>

	<!--
		TRG_CACHE_GUARD: 배포마다 최신 빌드를 받고 옛 캐시를 치운다.
		- 배포 스크립트(.github/workflows/deploy-web.yml)가 __TRG_BUILD_ID__(커밋 7자리)·__TRG_VERSION__(0.9.0+커밋)을 채운다. 로컬 내보내기는 그대로 남아 아무것도 하지 않는다.
		- 캐시 버스팅: index.wasm·index.pck(fetch)와 오디오 워클릿(addModule) 주소 뒤에 ?v=커밋을 붙인다. index.js는 아래 script 태그에 붙어 있고, 아바타 묶음은 게임이 ?v=버전을 붙인다.
		- 새 버전으로 처음 열면 Cache Storage를 모두 지우고 옛 서비스 워커를 해제한 뒤 trg_cached_version을 저장하고 부팅한다.
		  localStorage의 다른 값(닉네임·언어·볼륨)과 게임 세이브(IndexedDB user://)는 건드리지 않는다.
	-->
	<script id="trg-cache-guard">
		(function (root) {
			var BUILD_ID = "__TRG_BUILD_ID__";
			var CURRENT_VERSION = "__TRG_VERSION__";
			var VERSION_KEY = "trg_cached_version";
			var stamped = BUILD_ID.indexOf("__") !== 0 && CURRENT_VERSION.indexOf("__") !== 0;
			var BUSTED_FILES = /\.(wasm|pck|worklet\.js)$/;

			// 같은 사이트의 엔진 파일(.wasm·.pck·워클릿) 주소에만, 쿼리가 아직 없을 때 ?v=커밋을 붙인다.
			function bust(url) {
				if (!stamped) { return url; }
				try {
					var parsed = new URL(String(url), root.location.href);
					if (parsed.origin !== root.location.origin || parsed.search || !BUSTED_FILES.test(parsed.pathname)) { return url; }
					parsed.search = "v=" + encodeURIComponent(BUILD_ID);
					return parsed.href;
				} catch (e) {
					return url;
				}
			}

			// 새 버전이면 Cache Storage 전부와 서비스 워커를 정리한다. 무엇이 실패해도(사파리 사생활 보호 등) 부팅은 계속한다.
			function clean() {
				if (!stamped) { return Promise.resolve(false); }
				var previous = null;
				try { previous = root.localStorage.getItem(VERSION_KEY); } catch (e) { /* 저장소를 못 쓰는 브라우저 */ }
				if (previous === CURRENT_VERSION) { return Promise.resolve(false); }
				var jobs = [];
				if (root.caches && root.caches.keys) {
					jobs.push(root.caches.keys().then(function (keys) {
						return Promise.all(keys.map(function (key) { return root.caches.delete(key); }));
					}).catch(function () {}));
				}
				var workers = root.navigator && root.navigator.serviceWorker;
				if (workers && workers.getRegistrations) {
					jobs.push(workers.getRegistrations().then(function (registrations) {
						return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
					}).catch(function () {}));
				}
				var done = Promise.all(jobs).then(function () {
					try { root.localStorage.setItem(VERSION_KEY, CURRENT_VERSION); } catch (e) {}
					return true;
				});
				// 청소가 멈춰도 2초 뒤에는 부팅한다
				var timeout = new Promise(function (resolve) { setTimeout(function () { resolve(false); }, 2000); });
				return Promise.race([done, timeout]);
			}

			if (stamped && root.fetch) {
				var originalFetch = root.fetch;
				root.fetch = function (input, init) {
					if (typeof input === "string" || (root.URL && input instanceof root.URL)) { input = bust(input); }
					return originalFetch.call(root, input, init);
				};
			}
			if (stamped && root.AudioWorklet && root.AudioWorklet.prototype.addModule) {
				var originalAddModule = root.AudioWorklet.prototype.addModule;
				root.AudioWorklet.prototype.addModule = function (url, options) {
					return originalAddModule.call(this, bust(url), options);
				};
			}
			// 영구 기록(#태그·닉네임·도장, localStorage["trg_player_save_v1"] + IndexedDB user://)이 브라우저 공간 정리 때 지워지지 않게 '보존 저장소'를 요청한다.
			// 청소는 Cache Storage·서비스 워커만 지운다: localStorage 전체 비우기는 절대 하지 않는다.
			function keepStorage() {
				try {
					if (root.navigator && root.navigator.storage && root.navigator.storage.persist) {
						return root.navigator.storage.persist().catch(function () { return false; });
					}
				} catch (e) {}
				return Promise.resolve(false);
			}
			keepStorage();
			root.trgCacheGuard = { bust: bust, clean: clean, keepStorage: keepStorage, version: CURRENT_VERSION, buildId: BUILD_ID, stamped: stamped };
		})(window);
	</script>
	<script src="$GODOT_URL?v=__TRG_BUILD_ID__"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const TIPS = [
				"<b>팁</b> 윷말끼리 만나면 자동으로 업혀 한 번에 이동해요.",
				"<b>팁</b> 카드는 내 턴 굴리기 전에 턴당 1장만 낼 수 있어요.",
				"<b>팁</b> 카드를 보드판 위로 드래그해서 놓으면 발동해요.",
				"<b>팁</b> 필살기는 기물마다 게임당 1회, 내 프로필 카드에서 눌러요.",
				"<b>팁</b> 점프 코너(6·18번)에 정확히 멈추면 앞으로 껑충 뛰어요.",
				"<b>팁</b> 3라운드마다 증강을 골라 기물·판정 도구·교칙을 바꿔요.",
				"<b>팁</b> 중앙 법전은 4칸! 새 교칙이 들어오면 가장 오래된 교칙이 밀려나요.",
				"<b>팁</b> 폰을 가로로 돌려서 플레이하세요.",
				"<b>팁</b> 방 코드 5자리로 친구와 바로 친선 줘팸터를 할 수 있어요.",
				"<b>팁</b> 뱅! 카드는 상대 프로필을 눌러 선두 말을 2칸 뒤로 보내요.",
			];
			// 자동 회전이 꺼진 폰: 전체화면으로 만든 뒤 가로 고정을 요청한다 (사용자 터치가 필요하다).
			async function goLandscape() {
				try { await document.documentElement.requestFullscreen(); } catch (e) { /* 지원하지 않는 브라우저 */ }
				try { await screen.orientation.lock('landscape'); } catch (e) { /* iOS 등은 지원하지 않음 */ }
			}
			// 세로 안내 화면은 아무 곳이나 터치해도 전체화면 + 가로로 바뀐다. 첫 터치에도 한 번 시도한다.
			document.getElementById('rotate').addEventListener('click', goLandscape);
			document.addEventListener('pointerdown', function () {
				if (window.matchMedia('(orientation: portrait)').matches) { goLandscape(); }
			}, { once: true });
			const splash = document.getElementById('splash');
			const bar = document.getElementById('bar');
			const fill = document.getElementById('bar-fill');
			const loadingLabel = document.getElementById('loading-label');
			const percent = document.getElementById('percent');
			const tip = document.getElementById('tip');
			const notice = document.getElementById('notice');
			tip.innerHTML = TIPS[Math.floor(Math.random() * TIPS.length)];

			function setProgress(current, total) {
				if (bar.classList.contains('has-error')) return;
				if (Number.isFinite(total) && total > 0 && Number.isFinite(current)) {
					const value = Math.round(Math.max(0, Math.min(current / total, 1)) * 100);
					fill.classList.remove('indeterminate');
					bar.classList.remove('is-indeterminate');
					bar.style.setProperty('--progress', value + '%');
					bar.setAttribute('aria-valuenow', value);
					bar.setAttribute('aria-valuetext', value + '%');
					percent.textContent = value + '%';
					loadingLabel.textContent = value === 100 ? '곧 시작해요!' : '게임을 불러오고 있어요';
				} else {
					fill.classList.add('indeterminate');
					bar.classList.add('is-indeterminate');
					bar.removeAttribute('aria-valuenow');
					bar.setAttribute('aria-valuetext', '준비 중');
					percent.textContent = '준비 중…';
					loadingLabel.textContent = '게임을 준비하고 있어요';
				}
			}

			function hideSplash() {
				if (splash.classList.contains('hidden')) return;
				splash.classList.add('hidden');
				setTimeout(function () { splash.style.display = 'none'; }, 600);
			}

			function showNotice(text) {
				notice.style.display = 'block';
				notice.textContent = text;
				fill.classList.remove('indeterminate');
				bar.classList.remove('is-indeterminate');
				bar.classList.add('has-error');
				bar.removeAttribute('aria-valuenow');
				bar.setAttribute('aria-valuetext', '불러오기 중단');
				loadingLabel.textContent = '불러오기를 멈췄어요';
				percent.textContent = '확인 필요';
			}

			// 첫 화면이 3D 셰이더를 미리 컴파일하는 동안(멈춘 첫 프레임) 스플래시를 남겨 둔다: 게임이 준비되면 window.trgBootReady()를 부른다.
			let engineStarted = false;
			let gameReady = false;
			window.trgBootReady = function () {
				gameReady = true;
				if (engineStarted) { hideSplash(); }
			};

			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length !== 0) {
				showNotice('이 브라우저에서는 게임을 실행할 수 없습니다. 최신 브라우저를 사용해 주세요.\n(부족한 기능: ' + missing.join(', ') + ')');
			} else {
				// 새 버전이면 옛 캐시를 먼저 치우고 부팅한다 (trg-cache-guard)
				window.trgCacheGuard.clean().then(function () {
					return engine.startGame({
						onProgress: setProgress,
					});
				}).then(function () {
					setProgress(1, 1);
					// 엔진 시작 신호보다 게임의 준비 신호가 먼저 왔으면 바로 걷고, 아니면 신호(또는 6초 안전장치)를 기다린다.
					engineStarted = true;
					if (gameReady) { hideSplash(); } else { setTimeout(hideSplash, 6000); }
				}, function (err) {
					console.error(err);
					showNotice('게임을 불러오지 못했습니다: ' + err);
				});
			}
		})();
	</script>
